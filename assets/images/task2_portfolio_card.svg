    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="5" fill="#10B981"/>
    <text x="80" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748B">portfolio_tracker.py --demo</text>

