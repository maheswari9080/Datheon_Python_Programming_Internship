        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#8B5CF6">Datheon FAQ Dataset</text>
        <text x="14" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748B">task4_chatbot/data/sample_faq.json</text>
