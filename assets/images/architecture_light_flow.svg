          <text y="28">• Task 2: 14 / 14 Passed</text>
          <text y="42">• Task 3: 12 / 12 Passed</text>
          <text y="56">• Task 4: 14 / 14 Passed</text>
        </g>
        <g transform="translate(14, 118)">
          <rect width="180" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
          <text x="16" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#15803D">58 / 58 TESTS (100% OK)</text>
