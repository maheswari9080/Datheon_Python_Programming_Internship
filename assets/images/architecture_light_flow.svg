        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#10B981">S&amp;P 500 Constituents CSV</text>
        <text x="14" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748B">task2_portfolio/data/constituents.csv</text>
        <rect x="14" y="56" width="135" height="20" rx="4" fill="#DCFCE7"/>
        <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="bold" fill="#15803D">503 Validated Tickers</text>
