        <text x="14" y="80" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748B">python task3_organizer/organizer.py</text>
        <text x="14" y="98" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748B">python task4_chatbot/chatbot.py</text>
