      <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="800" fill="#475569" letter-spacing="0.5">1. DATA &amp; STORAGE LAYER</text>

      <!-- Source 1 -->
      <g transform="translate(18, 56)">
