      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" rx="24" fill="url(#bgGrad3)"/>
  <rect width="1200" height="680" rx="24" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M 0 24 Q 0 0 24 0 L 1176 0 Q 1200 0 1200 24 L 1200 6 L 0 6 Z" fill="#2563EB"/>

  <!-- Section Header -->
  <g transform="translate(60, 42)">
