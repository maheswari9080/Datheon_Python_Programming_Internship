        <text x="14" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748B">task1_hangman/data/words.txt</text>
        <rect x="14" y="56" width="135" height="20" rx="4" fill="#E0F2FE"/>
        <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="bold" fill="#0369A1">8,076 Filtered Candidates</text>
