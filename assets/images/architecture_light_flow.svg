    <circle cx="15" cy="15" r="5" fill="#2563EB"/>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" letter-spacing="1">SYSTEM ARCHITECTURE</text>

