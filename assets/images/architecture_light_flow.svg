        <text x="14" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#1E40AF">index.html (Client Portal)</text>
        <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#475569">Zero-server standalone navigation.</text>
        <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#475569">Pure HTML5, CSS tokens &amp; JS.</text>
